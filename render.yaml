services:
  - type: web
    name: digital-twin-risk-wind-tunnel
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python -c "from database import db; db.initialize(); db.create_tables()"
    startCommand: python web_app.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: digital-twin-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0
    healthCheckPath: /api/db/health
    autoDeploy: true

databases:
  - name: digital-twin-db
    databaseName: digital_twin
    user: dtuser
    plan: free
    region: oregon
