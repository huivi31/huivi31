version: '3.8'

services:
  app:
    build: .
    container_name: digital-twin-risk-wind-tunnel
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=sqlite:///data/app.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
      - FLASK_ENV=production
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/db/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可选：PostgreSQL数据库（用于生产环境）
  postgres:
    image: postgres:15-alpine
    container_name: digital-twin-postgres
    environment:
      - POSTGRES_DB=digital_twin
      - POSTGRES_USER=dtuser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - production

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
