<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统监控台 - v2.3.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0e27;
            color: #e4e4e4;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #1e293b;
        }
        
        h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .version {
            padding: 6px 12px;
            background: #1e293b;
            border-radius: 6px;
            font-size: 14px;
            color: #94a3b8;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        
        .card-title {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        
        .card-value {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .card-subtitle {
            font-size: 13px;
            color: #64748b;
        }
        
        .section {
            background: #1e293b;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        
        .section-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: #e4e4e4;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }
        
        .chart-container {
            height: 300px;
            position: relative;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        
        th {
            font-weight: 600;
            color: #94a3b8;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        td {
            color: #e4e4e4;
        }
        
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge-success {
            background: #10b98120;
            color: #10b981;
        }
        
        .badge-danger {
            background: #ef444420;
            color: #ef4444;
        }
        
        .badge-warning {
            background: #f59e0b20;
            color: #f59e0b;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        
        .refresh-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
        }
        
        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🎯 系统监控台</h1>
                <p style="color: #64748b; margin-top: 8px;">实时攻防数据分析</p>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span class="version">v2.3.0</span>
                <button class="refresh-btn" onclick="refreshData()">
                    🔄 刷新数据
                </button>
            </div>
        </header>
        
        <!-- 关键指标卡片 -->
        <div class="grid">
            <div class="card">
                <div class="card-title">总攻击次数</div>
                <div class="card-value" id="total-attacks">-</div>
                <div class="card-subtitle">最近24小时</div>
            </div>
            
            <div class="card">
                <div class="card-title">绕过率</div>
                <div class="card-value" id="bypass-rate">-</div>
                <div class="card-subtitle">成功绕过 / 总次数</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="bypass-progress" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-title">拦截率</div>
                <div class="card-value" id="detect-rate">-</div>
                <div class="card-subtitle">成功拦截 / 总次数</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="detect-progress" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-title">平均复杂度</div>
                <div class="card-value" id="avg-complexity">-</div>
                <div class="card-subtitle">攻击内容复杂度</div>
            </div>
        </div>
        
        <!-- 按技巧统计 -->
        <div class="section">
            <div class="section-title">按攻击技巧统计</div>
            <div id="technique-stats" class="loading">加载中...</div>
        </div>
        
        <!-- 按拦截层统计 -->
        <div class="section">
            <div class="section-title">按拦截层统计</div>
            <div id="layer-stats" class="loading">加载中...</div>
        </div>
        
        <!-- Top Agent排行 -->
        <div class="section">
            <div class="section-title">🏆 Top Agent 排行榜</div>
            <div id="top-agents" class="loading">加载中...</div>
        </div>
        
        <!-- 数据库健康 -->
        <div class="section">
            <div class="section-title">💾 数据库状态</div>
            <div id="db-health" class="loading">加载中...</div>
        </div>
    </div>
    
    <script>
        let refreshing = false;
        
        async function refreshData() {
            if (refreshing) return;
            refreshing = true;
            
            const btn = document.querySelector('.refresh-btn');
            btn.disabled = true;
            btn.textContent = '⏳ 刷新中...';
            
            try {
                await Promise.all([
                    loadStats(),
                    loadDBHealth()
                ]);
            } catch (e) {
                console.error('Failed to refresh:', e);
            }
            
            btn.disabled = false;
            btn.textContent = '🔄 刷新数据';
            refreshing = false;
        }
        
        async function loadStats() {
            try {
                const response = await fetch('/api/stats/summary?limit=1000');
                const data = await response.json();
                
                if (data.success) {
                    const overall = data.overall;
                    
                    // 更新关键指标
                    document.getElementById('total-attacks').textContent = overall.total_attacks || 0;
                    document.getElementById('bypass-rate').textContent = 
                        `${(overall.bypass_rate * 100).toFixed(1)}%`;
                    document.getElementById('detect-rate').textContent = 
                        `${((1 - overall.bypass_rate) * 100).toFixed(1)}%`;
                    document.getElementById('avg-complexity').textContent = 
                        overall.avg_complexity.toFixed(1);
                    
                    // 更新进度条
                    document.getElementById('bypass-progress').style.width = 
                        `${(overall.bypass_rate * 100)}%`;
                    document.getElementById('detect-progress').style.width = 
                        `${((1 - overall.bypass_rate) * 100)}%`;
                    
                    // 按技巧统计
                    renderTechniqueStats(data.by_technique);
                    
                    // 按拦截层统计
                    renderLayerStats(data.by_layer);
                    
                    // Top Agent
                    renderTopAgents(data.top_agents);
                }
            } catch (e) {
                console.error('Failed to load stats:', e);
            }
        }
        
        function renderTechniqueStats(byTechnique) {
            const container = document.getElementById('technique-stats');
            
            if (!byTechnique || Object.keys(byTechnique).length === 0) {
                container.innerHTML = '<p style="color: #64748b; text-align: center;">暂无数据</p>';
                return;
            }
            
            const sorted = Object.entries(byTechnique)
                .sort((a, b) => b[1].total - a[1].total)
                .slice(0, 10);
            
            let html = '<table><thead><tr>' +
                '<th>技巧</th>' +
                '<th>总次数</th>' +
                '<th>绕过次数</th>' +
                '<th>成功率</th>' +
                '</tr></thead><tbody>';
            
            sorted.forEach(([tech, stats]) => {
                const rate = stats.success_rate * 100;
                const badgeClass = rate > 50 ? 'badge-danger' : 
                                  rate > 20 ? 'badge-warning' : 'badge-success';
                
                html += `<tr>
                    <td>${tech}</td>
                    <td>${stats.total}</td>
                    <td>${stats.bypassed}</td>
                    <td><span class="badge ${badgeClass}">${rate.toFixed(1)}%</span></td>
                </tr>`;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }
        
        function renderLayerStats(byLayer) {
            const container = document.getElementById('layer-stats');
            
            if (!byLayer || Object.keys(byLayer).length === 0) {
                container.innerHTML = '<p style="color: #64748b; text-align: center;">暂无数据</p>';
                return;
            }
            
            const sorted = Object.entries(byLayer)
                .sort((a, b) => b[1] - a[1]);
            
            const total = sorted.reduce((sum, [_, count]) => sum + count, 0);
            
            let html = '<table><thead><tr>' +
                '<th>拦截层</th>' +
                '<th>拦截次数</th>' +
                '<th>占比</th>' +
                '</tr></thead><tbody>';
            
            sorted.forEach(([layer, count]) => {
                const percentage = (count / total * 100).toFixed(1);
                const layerName = {
                    'keyword': 'L1 关键词',
                    'pinyin': 'L2 拼音',
                    'semantic': 'L2 语义',
                    'regex': 'L3 正则',
                    'variant': 'L4 变体',
                    'llm': 'L5 LLM',
                    'bypassed': '✅ 绕过成功'
                }[layer] || layer;
                
                const badgeClass = layer === 'bypassed' ? 'badge-danger' : 'badge-success';
                
                html += `<tr>
                    <td>${layerName}</td>
                    <td>${count}</td>
                    <td><span class="badge ${badgeClass}">${percentage}%</span></td>
                </tr>`;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }
        
        function renderTopAgents(topAgents) {
            const container = document.getElementById('top-agents');
            
            if (!topAgents || topAgents.length === 0) {
                container.innerHTML = '<p style="color: #64748b; text-align: center;">暂无数据</p>';
                return;
            }
            
            let html = '<table><thead><tr>' +
                '<th>排名</th>' +
                '<th>Agent ID</th>' +
                '<th>总攻击</th>' +
                '<th>成功绕过</th>' +
                '<th>成功率</th>' +
                '</tr></thead><tbody>';
            
            topAgents.forEach((agent, index) => {
                const rank = index + 1;
                const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
                const rate = agent.success_rate * 100;
                const badgeClass = rate > 50 ? 'badge-danger' : 
                                  rate > 20 ? 'badge-warning' : 'badge-success';
                
                html += `<tr>
                    <td style="font-weight: 700;">${medal}</td>
                    <td style="font-family: monospace;">${agent.agent_id}</td>
                    <td>${agent.total}</td>
                    <td>${agent.bypassed}</td>
                    <td><span class="badge ${badgeClass}">${rate.toFixed(1)}%</span></td>
                </tr>`;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }
        
        async function loadDBHealth() {
            try {
                const response = await fetch('/api/db/health');
                const data = await response.json();
                
                const container = document.getElementById('db-health');
                
                if (data.success) {
                    const info = data.info;
                    container.innerHTML = `
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                            <div>
                                <div style="color: #94a3b8; font-size: 12px; margin-bottom: 4px;">状态</div>
                                <div style="font-size: 18px; color: #10b981;">✓ ${info.status}</div>
                            </div>
                            <div>
                                <div style="color: #94a3b8; font-size: 12px; margin-bottom: 4px;">数据库类型</div>
                                <div style="font-size: 18px;">${info.database || 'SQLite'}</div>
                            </div>
                            <div>
                                <div style="color: #94a3b8; font-size: 12px; margin-bottom: 4px;">活跃连接</div>
                                <div style="font-size: 18px;">${info.active_connections || 0}</div>
                            </div>
                            <div>
                                <div style="color: #94a3b8; font-size: 12px; margin-bottom: 4px;">总记录数</div>
                                <div style="font-size: 18px;">${info.total_records || 0}</div>
                            </div>
                        </div>
                    `;
                } else {
                    container.innerHTML = '<p style="color: #ef4444;">❌ 数据库连接失败</p>';
                }
            } catch (e) {
                console.error('Failed to load DB health:', e);
                document.getElementById('db-health').innerHTML = 
                    '<p style="color: #ef4444;">❌ 无法获取数据库状态</p>';
            }
        }
        
        // 页面加载时自动刷新
        refreshData();
        
        // 每30秒自动刷新
        setInterval(refreshData, 30000);
    </script>
</body>
</html>
